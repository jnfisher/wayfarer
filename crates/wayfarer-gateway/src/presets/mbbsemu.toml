# Logon script for MajorMUD under MBBSEmu (the dialogue in tests/fixtures/captures/
# entry-existing and logoff-in-realm, and kb/connection.md "Login flow (MBBSEmu)").
#
# `expect` and `at` are a substring, or a regex after `re:`, matched against the text since the
# last step with ANSI escapes removed. `send` may use {user} and {password}. Timeouts are in
# seconds.

# The realm prompt, `[HP=35]:` or `[HP=35/MA=12]:`: the script has succeeded.
realm = 're:\[HP=-?\d+[^\]\n]*\]:'
realm_timeout = 30

[[step]]
expect = "Username:"
send = "{user}"

[[step]]
expect = "Password:"
send = "{password}"

[[step]]
expect = "Make your selection"
send = "M"

[[step]]
expect = "[MAJORMUD]:"
send = "E"

# MBBSEmu goes back to `Username:` after a wrong password and lets a client retry forever.
[[failure]]
expect = "Invalid Credentials"
reason = "bad credentials"
retry = false
# Or the BBS doesn't know the user: a character whose account is to be made signs up.
signup = true

# `<user> is already logged in -- only 1 connection allowed per user.`: the old connection may
# still be closing.
[[failure]]
expect = "is already logged in"
reason = "already logged in"
retry = true

# Making a BBS account for a user the BBS does not know (the Accounts panel, C-062): `NEW`, the
# user, the password twice, the e-mail and the gender, then on to the MajorMUD menu and no
# further, so the player makes the character. A question asked again means the BBS refused the
# answer (a taken name, a password it won't take); the line before it says why. The prompts are
# MBBSEmu's (`MenuRoutines.cs`, a capture of its sign-up), which silvermere copies.
[signup]
stop_at = "[MAJORMUD]:"

[[signup.step]]
expect = "Username:"
send = "NEW"

[[signup.step]]
expect = "Please enter a unique Username"
send = "{user}"

[[signup.step]]
expect = "Please enter a strong Password"
send = "{password}"

[[signup.step]]
expect = "re-enter your password"
send = "{password}"

[[signup.step]]
expect = "Please enter a valid e-Mail"
send = "{email}"

[[signup.step]]
expect = "Please enter your gender"
send = "{gender}"

[[signup.step]]
expect = "Make your selection"
send = "M"
optional = true

# Log-off. Each step is a place the session can be (`at`; the first step's place is the realm)
# and what it sends there; then the next step's `at` is waited for, up to `timeout` (20 s if
# not given). A step's `retry_on` texts mean "not yet": it is sent again when its place shows
# again, up to `retries` times (20 if not given), all within its `timeout`. After the last step
# the server closes the connection.
[[logoff]]
send = "x"
# Any attack during the six-tick meditation, hit or miss, interrupts it (`kb/recovery.md`
# "An attack cancels the exit"): `x` again at the next prompt, up to `retries` times. The
# timeout covers them all.
retry_on = ["meditation has been interrupted"]
retries = 20
timeout = 240

[[logoff]]
at = "[MAJORMUD]:"
send = "X"

[[logoff]]
at = "Make your selection"
send = "X"

[[logoff]]
at = "Are you sure"
send = "Y"
timeout = 10
