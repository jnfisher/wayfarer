[package]
name = "wayfarer-gateway"
description = "The gateway: telnet sessions, output log, logon scripts, fan-out to UIs (docs/plan/02-architecture.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
directories = "6"
futures-util = "0.3.34"
getrandom = "0.4.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml = "1"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing.workspace = true
wayfarer-proto = { path = "../wayfarer-proto" }
wayfarer-telnet = { path = "../wayfarer-telnet" }

[dev-dependencies]
fastrand = "2"
tempfile = "3"
tokio-tungstenite = "0.30.0"
tracing-subscriber.workspace = true
