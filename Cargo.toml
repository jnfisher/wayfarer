[workspace]
resolver = "2"
members = [
    "crates/wayfarer-proto",
    "crates/wayfarer-telnet",
    "crates/wayfarer-gateway",
    "crates/wayfarer-world",
    "bin/wayfarer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/jnfisher/wayfarer"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"

# Fast builds and tests: no debug info, which is most of the link time.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# wayfarer-world's pack build (its one slow test) parses, inflates, hashes and stores ~60 MB:
# 5 s unoptimised, 2 s like this. The crate itself is in the list because the serde_json and
# rusqlite code it calls is generic, so it is compiled there.
[profile.dev.package]
wayfarer-world.opt-level = 2
libsqlite3-sys.opt-level = 2
miniz_oxide.opt-level = 2
sha2.opt-level = 2
