[workspace]
resolver = "2"
members = [
    "crates/wayfarer-proto",
    "crates/wayfarer-telnet",
    "crates/wayfarer-gateway",
    "bin/wayfarer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/jnfisher/wayfarer"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Fast builds and tests: no debug info, which is most of the link time.
[profile.dev]
debug = 0

[profile.test]
debug = 0
