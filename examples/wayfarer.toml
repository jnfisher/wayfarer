# wayfarer.toml: the game servers and the characters the gateway holds sessions for.
# Passwords go in credentials.toml beside this file, never here.
# The gateway reads this from your data directory (on macOS ~/Library/Application Support/wayfarer/,
# on Linux ~/.local/share/wayfarer/), or from
# the path given with --config.

[[server]]
id = "home"                 # referred to by the characters below
host = "bbs.example.org"
port = 23
preset = "mbbsemu"          # the logon script to use (mbbsemu or silvermere)

[[character]]
id = "kasimir"              # the session id: letters, digits, - and _; names logs/kasimir/
name = "Kasimir"            # shown on the session's tile
server = "home"
autostart = true            # connect when the gateway starts

[[character]]
id = "brenna"
name = "Brenna"
server = "home"
