[profile.default]
# A test over one second needs a reason in its comment (docs/plan/tasks/README.md).
slow-timeout = { period = "1s" }

[profile.ci]
fail-fast = false
slow-timeout = { period = "1s" }

# The gear catalogue (C-058): a build reads the rooms on a second thread, so each of its tests
# takes two; the timing test runs with nothing beside it, since other tests only slow it down.
# The ci profile inherits these.
[[profile.default.overrides]]
filter = 'package(wayfarer-world) & binary(gear) & test(=a_whole_catalogue_builds_in_time)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(wayfarer-world) & binary(gear)'
threads-required = 2

# The gear plan (C-059): a plan scores its weapons on a thread per core, and its timing test
# runs with nothing beside it, as the catalogue's does.
[[profile.default.overrides]]
filter = 'package(wayfarer-brain) & binary(gear_plan) & test(=a_whole_witchunter_plan_answers_in_time)'
threads-required = "num-cpus"
